<!-- Cookieless analytics; no consent banner needed. The hashed script filename
     identifies the site and carries the root domain cososo.co.uk, so this page,
     the WordPress site and /solid-syslog/ share one dashboard, split by hostname.
     The same snippet lives in solid-syslog's overrides/main.html. The inline stub
     must stay: the tracker is deferred, so it runs after this block and picks up
     the options from plausible.o. -->
<script defer src="https://plausible.io/js/pa-rbQGvMhd4GxKexbnXvDJE.js"></script>
<script>
window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
plausible.init();

<style>
  :root { --accent:#3e2199; --heading:#2d2d2d; --body:#626262; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Open Sans",sans-serif; color:var(--body);
         line-height:1.73; background:#fff; }
  .wrap { max-width:640px; margin:0 auto; padding:14vh 24px 8vh; }
  h1 { font-family:"Montserrat",sans-serif; font-weight:600; color:var(--heading);
       font-size:29px; margin:0 0 .4em; }
  .lede { font-size:18px; margin:0 0 2.5em; }
  a { color:var(--accent); }
  ul.products { list-style:none; margin:0; padding:0; }
  ul.products li { border:1px solid #ececf0; border-radius:6px; margin-bottom:14px; }
  ul.products li a { display:block; padding:18px 22px; text-decoration:none; color:var(--heading); }
  ul.products li a:hover { border-color:var(--accent); }
  ul.products .name { font-family:"Montserrat",sans-serif; font-weight:600; font-size:20px; }
  ul.products .desc { color:var(--body); font-size:15px; margin-top:2px; }
  ul.products li:hover { box-shadow:0 0 0 1px var(--accent) inset; }
  footer { margin-top:3em; font-size:14px; color:#8a8a92; }
  footer a { color:#8a8a92; }
</style>
</head>

  <div class="wrap">
    <h1>Product documentation</h1>

      </li>
    </ul>
    <footer><a href="https://www.cososo.co.uk/">← cososo.co.uk</a></footer>
  </div>
